<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menuhat</title>
  </head>
  <body>
    <div id="root" class="flex flex-d-column"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const theme = localStorage.getItem("theme")
      const lang = localStorage.getItem("LANG_DISPLAY")
      if (theme && theme !== "defualt") {
        document.documentElement.setAttribute("theme", theme)
      }
      if (lang && lang.includes("ar")) {
        document.dir = "rtl"
      }
    </script>
  </body>
</html>
